<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
  <title>{{{ PRODUCT_NAME }}}</title>
  <link rel="icon" type="image/png" href="./favicon.png">
  <style>
    html, body { margin: 0; padding: 0; border: 0; width: 100%; height: 100%; }
    body {
      background-color: #f9efe6;
      overflow: hidden;
      touch-action: none;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    #unity-canvas { display: block; width: 100%; height: 100%; outline: none; background: #f9efe6; }
    #status {
      position: absolute; inset: 0; display: none;
      flex-direction: column; justify-content: center; align-items: center;
      background-color: #fad6f2; z-index: 10;
    }
    #status-notice {
      margin: 0 2rem; padding: 1rem; border-radius: 0.5rem;
      border: 1px solid #b39580; background: #f9efe6; color: #8f857d;
      font-family: 'Noto Sans', Arial, sans-serif; line-height: 1.3; text-align: center;
    }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <noscript>Your browser does not support JavaScript.</noscript>
  <div id="status"><div id="status-notice"></div></div>

  <!-- Shipped next to the build, never from a CDN: YouTube Playables forbids external requests and dynamic scripts. -->
  <script src="./playgama-bridge.js"></script>
  <script src="Build/{{{ LOADER_FILENAME }}}"></script>
  <script>
    (function () {
      // No long-press menu, right-click menu or text selection on the playfield.
      ['contextmenu', 'selectstart', 'dragstart'].forEach(function (name) {
        document.addEventListener(name, function (e) { e.preventDefault(); });
      });

      function showError(message) {
        var n = document.getElementById('status-notice');
        var s = document.getElementById('status');
        if (!n || !s || s.style.display === 'flex') return;
        n.textContent = 'The game could not start. ' + (message || 'Please reload the page.');
        s.style.display = 'flex';
      }
      window.addEventListener('error', function (e) { showError(e && e.message); });

      // Resolves once the Bridge is ready, or after a hard timeout so the game always boots (same as
      // src/platform/bridgeBootstrap.ts).
      function initBridge() {
        return new Promise(function (resolve) {
          var bridge = window.bridge;
          if (!bridge || typeof bridge.initialize !== 'function') {
            console.warn('[bridge] not present - continuing without platform');
            return resolve();
          }
          var settled = false;
          function done() { if (!settled) { settled = true; resolve(); } }
          setTimeout(done, 6000);
          try { bridge.engine = 'unity'; } catch (e) { /* optional field */ }
          Promise.resolve(bridge.initialize()).then(done, function (err) {
            console.warn('[bridge] initialize failed - continuing without platform:', err);
            done();
          });
        });
      }

      function loadingProgress(percent) {
        try {
          if (window.bridge && typeof window.bridge.setGameLoadingProgress === 'function') window.bridge.setGameLoadingProgress(percent);
        } catch (e) { /* ignore */ }
      }

      var config = {
        dataUrl: 'Build/{{{ DATA_FILENAME }}}',
        frameworkUrl: 'Build/{{{ FRAMEWORK_FILENAME }}}',
#if USE_WASM
        codeUrl: 'Build/{{{ CODE_FILENAME }}}',
#endif
#if MEMORY_FILENAME
        memoryUrl: 'Build/{{{ MEMORY_FILENAME }}}',
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: 'Build/{{{ SYMBOLS_FILENAME }}}',
#endif
        streamingAssetsUrl: 'StreamingAssets',
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        // The game paints on the CPU: cap the backing store so 3x phone screens stay smooth.
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
        showBanner: function (msg, type) {
          if (type === 'error') showError(msg);
          else console.warn(msg);
        },
      };

      initBridge().then(function () {
        loadingProgress(0);
        // The download is the first half of the platform's loading bar; the game itself reports 50 and 100.
        return createUnityInstance(document.querySelector('#unity-canvas'), config, function (p) {
          loadingProgress(Math.min(49, Math.round(p * 49)));
        });
      }).then(function (instance) {
        window.unityInstance = instance;
        // A hidden page goes silent and freezes (Playgama 3.3.5); the build keeps running in the background otherwise.
        var sendVisibility = function () {
          try { instance.SendMessage('CozyBlocks', 'OnPageVisibility', document.hidden ? '0' : '1'); } catch (e) { /* not booted yet */ }
        };
        document.addEventListener('visibilitychange', sendVisibility);
        window.addEventListener('pagehide', function () {
          try { instance.SendMessage('CozyBlocks', 'OnPageVisibility', '0'); } catch (e) { /* ignore */ }
        });
        window.addEventListener('pageshow', sendVisibility);
      }).catch(function (err) {
        console.error('boot failed', err);
        showError(err && err.message ? err.message : String(err));
      });
    })();
  </script>
</body>
</html>
